name: Python analysis tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tools.test_parse_hs_err
      - run: python tools/parse_hs_err.py analysis/fixtures/controlled-crash-3.log > /tmp/controlled-crash-3.json
